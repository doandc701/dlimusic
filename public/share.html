<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playlist được chia sẻ · DLiMusic</title>
    <!-- a secret link: never listed by search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <script src="/js/theme.js"></script>
    <script src="/js/lang/vi.js"></script>
    <script src="/js/lang/en.js"></script>
    <script src="/js/lang/zh.js"></script>
    <script src="/js/lang/ja.js"></script>
    <script src="/js/i18n.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/400.css"
      integrity="sha384-fECtygcYnEz8ByOuPD+RHnE99jc4IjzdYKyFtRjfyrX6f128oLhcf+gltKwOXsuy"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/500.css"
      integrity="sha384-/brKXsQ9HNPeIbWnE/gQ5qD3RWQy8x8eTXQaZOPpb3CYnlgGHBpjDTT7vnrsBm2W"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/600.css"
      integrity="sha384-+KBBy2X9d0DKtfNEwwCmfGITI0kYdYEZ8Zb/nvCTOBlRLi1jnCIYmcwIXURTwzjz"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/700.css"
      integrity="sha384-IRUu+AGBg3+2KEmOfNOfNGlsXhgSQy9Jzm8uraZTloFx3ybT7o0oKR0DDCLxZTV+"
      crossorigin="anonymous"
    />
    <!-- the app's own look: colours, buttons, the player dock (the same as the main page) -->
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      /* the main page's list (styles.css .file-table, same columns), without what needs an account: the first
         column (tick boxes) and the last one (♥) stay, empty and narrow, so the column rules still apply */
      .share-view .file-table .col-check,
      .share-view .file-table td:nth-child(1),
      .share-view .file-table .col-fav,
      .share-view .file-table td:nth-child(6) {
        width: 8px !important;
        padding: 0 !important;
      }
      .share-view .file-table tr.pending {
        opacity: 0.55;
        cursor: default;
      }
      .share-view .name-file .bi {
        margin-right: 0.15rem;
      }
      /* the link can no longer be heard: the headphones cat asleep (greyer, breathing slowly, "z z z" rising) */
      .gone-cat-wrap {
        position: relative;
        display: inline-block;
      }
      .gone-cat-wrap .empty-cat {
        filter: grayscale(0.55) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.18));
        opacity: 0.85;
        animation: cat-sleep 4.5s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      [data-bs-theme="dark"] .gone-cat-wrap .empty-cat {
        filter: grayscale(0.55) drop-shadow(0 0 22px rgba(255, 196, 130, 0.12))
          drop-shadow(0 12px 18px rgba(0, 0, 0, 0.55));
      }
      @keyframes cat-sleep {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.015, 0.985);
        }
      }
      .gone-z {
        position: absolute;
        top: 4%;
        right: 6%;
        font-weight: 700;
        color: var(--bs-primary);
        opacity: 0;
        animation: z-rise 3.6s ease-in infinite;
        pointer-events: none;
      }
      .gone-z:nth-child(2) {
        animation-delay: 1.2s;
        font-size: 1.25rem;
      }
      .gone-z:nth-child(3) {
        animation-delay: 2.4s;
        font-size: 1.6rem;
      }
      @keyframes z-rise {
        0% {
          opacity: 0;
          transform: translate(0, 0) rotate(-10deg);
        }
        20% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate(28px, -70px) rotate(10deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gone-cat-wrap .empty-cat,
        .gone-z {
          animation: none;
        }
        .gone-z {
          opacity: 0.6;
        }
      }
      .gone-card {
        max-width: 420px;
      }
    </style>
  </head>

  <body class="d-flex flex-column app-body">
    <!-- page load: the main page's splash (styles.css .boot-splash); the name is complete once the playlist is read -->
    <div class="boot-splash" id="bootSplash" role="status" aria-label="Đang tải DLiMusic">
      <img src="/img/logo-320.webp" class="boot-logo" alt="" />
      <div class="boot-word" id="bootWord" aria-hidden="true">
        <span>D</span><span>L</span><span>i</span><span>M</span><span>u</span><span>s</span><span>i</span><span>c</span>
      </div>
    </div>
    <nav class="navbar bg-body border-bottom px-3 py-2 flex-nowrap">
      <a class="navbar-brand fw-bold mb-0 text-truncate" href="#" id="homeLink" aria-label="DLiMusic — về trang đầu"
        ><img src="/img/logo-128.png" class="brand-logo" alt="" /><span class="brand-text">DLiMusic</span></a
      >
      <div class="d-flex align-items-center gap-2 ms-auto flex-none">
        <!-- interface language and light / dark: the main page's (index.html), driven by share.js -->
        <div class="dropdown" id="langMenu">
          <button
            class="btn btn-sm btn-outline-secondary lang-btn"
            id="langBtn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Ngôn ngữ"
            aria-label="Ngôn ngữ"
          >
            <i class="bi bi-translate"></i><span class="lang-code" id="langCode" translate="no">VI</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm lang-list" id="langList" translate="no"></ul>
        </div>
        <button
          class="btn btn-sm btn-outline-secondary btn-icon"
          id="themeBtn"
          type="button"
          title="Chuyển sang giao diện tối"
        >
          <i class="bi bi-sun-fill" id="themeIcon"></i>
        </button>
        <a class="btn btn-sm btn-outline-primary" href="/" title="Mở DLiMusic"
          ><i class="bi bi-box-arrow-up-right"></i><span class="d-none d-sm-inline"> Mở DLiMusic</span></a
        >
      </div>
    </nav>

    <!-- the list like a chat of the main page (index.html #chatView): head, toolbar, the songs' table -->
    <!-- the start screen of the main page (index.html #emptyView): the logo shows it, the music plays on; the cat
         with headphones, the dancing kittens while music plays. A tap on the cat goes back to the list. -->
    <div
      class="flex-grow-1 d-none align-items-center justify-content-center text-body-secondary text-center p-4"
      id="emptyView"
    >
      <div role="button" tabindex="0" id="catBack" title="Xem danh sách bài">
        <img
          class="empty-cat"
          id="emptyCat"
          src="/img/cat-headphones.webp"
          alt="Mèo đeo tai nghe đang thưởng thức nhạc"
          width="233"
          height="320"
        />
        <div
          class="empty-cat cat-dance d-none"
          id="emptyCatDance"
          role="img"
          aria-label="Hai chú mèo con đang nhảy theo nhạc"
        ></div>
        <p class="small mt-2">Chạm vào mèo để xem danh sách bài</p>
      </div>
    </div>

    <!-- the link can no longer be heard (expired, revoked, not found) or could not be opened: share.js shows it -->
    <div
      class="flex-grow-1 d-none align-items-center justify-content-center text-center p-4 overflow-auto"
      id="goneView"
    >
      <div class="gone-card">
        <div class="gone-cat-wrap" aria-hidden="true">
          <img class="empty-cat" src="/img/cat-headphones.webp" alt="" width="233" height="320" />
          <span class="gone-z">z</span><span class="gone-z">z</span><span class="gone-z">z</span>
        </div>
        <h5 class="mt-3 mb-2" id="goneTitle">Link này đã hết hạn</h5>
        <p class="text-body-secondary mb-1" id="goneText"></p>
        <p class="small text-body-secondary mb-3" id="goneHint">Hãy nhắn người chia sẻ để xin link mới.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <button class="btn btn-outline-secondary d-none" type="button" id="goneRetry">
            <i class="bi bi-arrow-clockwise"></i> Thử lại
          </button>
          <a class="btn btn-primary" href="/"><i class="bi bi-music-note-beamed"></i> Mở DLiMusic</a>
        </div>
      </div>
    </div>

    <section class="flex-grow-1 d-flex flex-column min-h-0 overflow-hidden share-view" id="listView">
      <div class="bg-body border-bottom px-3 py-2 d-flex flex-wrap align-items-center gap-2 chat-head">
        <div class="flex-grow-1 min-w-0">
          <h5 class="mb-0 text-truncate" id="chatTitle" translate="no"></h5>
          <div class="small text-body-secondary text-truncate" id="chatMembers"></div>
        </div>
        <!-- shuffled: the shuffle button of the player, then this (no second shuffle button up here) -->
        <button class="btn btn-sm btn-primary pl-play flex-none" id="plPlayBtn" title="Phát tất cả" disabled>
          <i class="bi bi-play-fill"></i> <span class="d-none d-md-inline">Phát tất cả</span>
        </button>
      </div>

      <div class="bg-body-tertiary border-bottom px-3 py-2 d-flex flex-wrap align-items-center gap-2">
        <div class="input-group input-group-sm search-files">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" id="fileSearch" placeholder="Tìm tên bài, ca sĩ…" />
        </div>
        <div class="input-group input-group-sm w-auto">
          <span class="input-group-text" title="Sắp xếp"><i class="bi bi-sort-down"></i></span>
          <select class="form-select" id="sortSel" aria-label="Sắp xếp">
            <option value="default">Mặc định (thứ tự playlist)</option>
            <option value="reverse">Ngược lại</option>
            <option value="name-asc">Tên A → Z</option>
            <option value="name-desc">Tên Z → A</option>
            <option value="size-desc">Dung lượng lớn → nhỏ</option>
            <option value="size-asc">Dung lượng nhỏ → lớn</option>
            <option value="dur-desc">Thời lượng dài → ngắn</option>
            <option value="dur-asc">Thời lượng ngắn → dài</option>
          </select>
        </div>
        <span class="ms-auto small text-body-secondary" id="fileCount"></span>
      </div>

      <div class="flex-grow-1 overflow-auto bg-body" id="filesWrap">
        <table class="table table-hover table-sm align-middle mb-0 file-table d-none" id="filesTable">
          <thead>
            <tr>
              <th class="col-check"></th>
              <th class="col-play"></th>
              <th class="col-num text-body-secondary sortable" data-sort="num" title="Sắp theo thứ tự playlist">
                # <i class="bi sort-ico"></i>
              </th>
              <th class="sortable" data-sort="name" title="Sắp theo tên">Tên bài <i class="bi sort-ico"></i></th>
              <th class="col-size text-end sortable" data-sort="size" title="Bấm: dung lượng · bấm tiếp: thời lượng">
                Dung lượng <i class="bi sort-ico"></i>
              </th>
              <th class="col-fav"></th>
            </tr>
          </thead>
          <tbody id="files" translate="no"></tbody>
        </table>
        <div id="filesMsg">
          <div class="text-center text-body-secondary p-5">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Đang mở playlist…
          </div>
        </div>
      </div>
    </section>

    <!-- the player: the main page's dock (styles.css), without what needs an account (♥, sleep timer) -->
    <footer class="player-bar player-dock d-none" id="playerBar">
      <div class="dock-info">
        <span class="dock-art" aria-hidden="true"><i class="bi bi-music-note-beamed"></i></span>
        <span class="dock-text" translate="no">
          <span class="dock-title" id="npTitle" role="button" tabindex="0" title="Tới bài này trong danh sách"></span>
          <span class="dock-sub" id="npSub"></span>
        </span>
      </div>
      <div class="dock-center">
        <div class="dock-controls">
          <button
            class="btn btn-sm btn-outline-secondary btn-icon border-0 mode-btn"
            id="shuffleBtn"
            title="Phát ngẫu nhiên: tắt"
            aria-pressed="false"
          >
            <i class="bi bi-shuffle"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary btn-icon border-0" id="prevBtn" title="Bài trước (Shift + ←)">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-secondary btn-icon border-0 seek10-btn"
            id="backBtn"
            title="Lùi 10 giây (phím ←)"
            aria-label="Lùi 10 giây"
          >
            <i class="bi bi-arrow-counterclockwise"></i><span class="seek10" aria-hidden="true">10</span>
          </button>
          <button class="btn btn-primary btn-play" id="playBtn" title="Phát / tạm dừng (phím Space)">
            <i class="bi bi-play-fill"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-secondary btn-icon border-0 seek10-btn"
            id="fwdBtn"
            title="Tiến 10 giây (phím →)"
            aria-label="Tiến 10 giây"
          >
            <i class="bi bi-arrow-clockwise"></i><span class="seek10" aria-hidden="true">10</span>
          </button>
          <button
            class="btn btn-sm btn-outline-secondary btn-icon border-0"
            id="nextBtn"
            title="Bài tiếp theo (Shift + →)"
          >
            <i class="bi bi-skip-end-fill"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-secondary btn-icon border-0 mode-btn"
            id="repeatBtn"
            title="Lặp lại: tắt"
            aria-pressed="false"
          >
            <i class="bi bi-repeat"></i>
          </button>
        </div>
        <div class="dock-seek">
          <small class="time" id="curTime">0:00</small>
          <div class="seek-wrap" id="seekWrap">
            <input
              type="range"
              class="form-range seek"
              id="seekRange"
              min="0"
              max="1000"
              step="1"
              value="0"
              aria-label="Vị trí trong bài"
            />
            <span class="seek-tip" id="seekTip" aria-hidden="true"></span>
          </div>
          <small class="time" id="durTime">0:00</small>
        </div>
      </div>
      <div class="dock-right">
        <!-- sleep timer (like YouTube's): pause after some minutes, or when this song ends -->
        <div class="dropup sleep-wrap">
          <button
            class="btn btn-sm btn-outline-secondary border-0 sleep-btn"
            id="sleepBtn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Hẹn giờ ngủ"
            aria-label="Hẹn giờ ngủ"
          >
            <i class="bi bi-alarm"></i><span class="sleep-left d-none" id="sleepLeft"></span>
          </button>
          <div class="dropdown-menu dropdown-menu-end sleep-menu">
            <h6 class="dropdown-header">Hẹn giờ ngủ</h6>
            <div id="sleepList"></div>
          </div>
        </div>
        <div class="dropup speed-wrap">
          <button
            class="btn btn-sm btn-outline-secondary border-0 speed-btn"
            id="speedBtn"
            type="button"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
            title="Tốc độ phát"
          >
            1x
          </button>
          <div class="dropdown-menu dropdown-menu-end speed-menu">
            <div class="d-flex align-items-center gap-2 px-3 pt-1 pb-2">
              <span class="speed-val" id="speedVal">1.0x</span>
              <input
                type="range"
                class="form-range"
                id="speedRange"
                min="0.5"
                max="2"
                step="0.1"
                value="1"
                aria-label="Tốc độ phát"
              />
            </div>
            <div class="dropdown-divider"></div>
            <div id="speedList"></div>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-secondary btn-icon border-0" id="muteBtn" title="Tắt / bật tiếng">
          <i class="bi bi-volume-up-fill"></i>
        </button>
        <input
          type="range"
          class="form-range vol"
          id="volRange"
          min="0"
          max="1"
          step="0.05"
          value="1"
          aria-label="Âm lượng"
        />
      </div>
      <audio id="player" preload="metadata" class="d-none"></audio>
    </footer>

    <!-- the main page's footer (index.html #pageCopy): the year and the slogan are filled in by share.js -->
    <footer class="app-copy page-copy border-top">
      © <span class="copy-year"></span> DLiMusic · <span class="app-slogan"></span>
    </footer>

    <!-- ============ toast (like the main page's) ============ -->
    <div class="toast-container position-fixed start-50 translate-middle-x app-toasts">
      <div class="toast fun-toast border-0" id="toast" role="status" aria-live="polite" data-kind="success">
        <div class="d-flex align-items-center gap-2 ps-2">
          <span class="toast-ico" aria-hidden="true"><i class="bi bi-check-lg" id="toastIcon"></i></span>
          <div class="toast-body flex-grow-1 ps-1" id="toastBody"></div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Đóng"></button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/share.js"></script>
  </body>
</html>
