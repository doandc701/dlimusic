<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playlist được chia sẻ · DLiMusic</title>
    <!-- a secret link: never listed by search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <script src="/js/theme.js"></script>
    <script src="/js/lang/vi.js"></script>
    <script src="/js/lang/en.js"></script>
    <script src="/js/lang/zh.js"></script>
    <script src="/js/lang/ja.js"></script>
    <script src="/js/i18n.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/400.css"
      integrity="sha384-fECtygcYnEz8ByOuPD+RHnE99jc4IjzdYKyFtRjfyrX6f128oLhcf+gltKwOXsuy"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5.3.0/600.css"
      integrity="sha384-+KBBy2X9d0DKtfNEwwCmfGITI0kYdYEZ8Zb/nvCTOBlRLi1jnCIYmcwIXURTwzjz"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bs-font-sans-serif: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        --bs-body-font-size: 0.9375rem;
        --bs-body-line-height: 1.55;
        --sh-accent: #7c3aed;
      }
      [data-bs-theme="dark"] {
        --sh-accent: #a78bfa;
      }
      body {
        min-height: 100dvh;
        padding-bottom: 7.5rem; /* room for the player */
        -webkit-font-smoothing: antialiased;
      }
      .sh-wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .sh-brand {
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--bs-body-color);
        text-decoration: none;
      }
      .sh-brand img {
        width: 28px;
        height: 28px;
        border-radius: 22%;
      }
      .sh-cover {
        width: 96px;
        height: 96px;
        flex: none;
        border-radius: 1rem;
        display: grid;
        place-items: center;
        font-size: 2.5rem;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #db2777);
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.01em;
        word-break: break-word;
      }
      .sh-song {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        padding: 0.55rem 0.75rem;
        border: 0;
        border-radius: 0.6rem;
        background: none;
        color: inherit;
        text-align: left;
      }
      .sh-song:hover {
        background: var(--bs-tertiary-bg);
      }
      .sh-song.playing {
        background: var(--bs-tertiary-bg);
        color: var(--sh-accent);
      }
      .sh-song .num {
        width: 1.75rem;
        flex: none;
        text-align: center;
        color: var(--bs-secondary-color);
        font-variant-numeric: tabular-nums;
      }
      .sh-song.playing .num {
        color: var(--sh-accent);
      }
      .sh-song .meta {
        min-width: 0;
        flex: 1;
      }
      .sh-song .title,
      .sh-song .artist {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .sh-song .artist,
      .sh-song .dur {
        font-size: 0.8rem;
        color: var(--bs-secondary-color);
      }
      .sh-player {
        position: fixed;
        inset: auto 0 0 0;
        background: var(--bs-body-bg);
        border-top: 1px solid var(--bs-border-color);
        padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom));
      }
      .sh-player .now {
        min-width: 0;
        flex: 1;
      }
      .sh-player .now span {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .sh-btn {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 0;
        font-size: 1.25rem;
      }
      .sh-btn.main {
        width: 3rem;
        height: 3rem;
        font-size: 1.6rem;
        color: #fff;
        background: var(--sh-accent);
        border: 0;
      }
      .sh-time {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--bs-secondary-color);
        width: 2.75rem;
        flex: none;
      }
      .sh-seek::-webkit-slider-thumb {
        background: var(--sh-accent);
      }
      .sh-seek::-moz-range-thumb {
        background: var(--sh-accent);
      }
      #shPlayAll {
        --bs-btn-bg: var(--sh-accent);
        --bs-btn-border-color: var(--sh-accent);
        --bs-btn-hover-bg: var(--sh-accent);
        --bs-btn-hover-border-color: var(--sh-accent);
        --bs-btn-active-bg: var(--sh-accent);
      }
      .min-w-0 {
        min-width: 0;
      }
    </style>
  </head>

  <body>
    <div class="sh-wrap">
      <header class="d-flex align-items-center justify-content-between py-3">
        <a class="sh-brand d-flex align-items-center gap-2" href="/"
          ><img src="/img/logo-128.png" alt="" /><span>DLiMusic</span></a
        >
      </header>

      <main id="shMain">
        <div class="text-center text-body-secondary py-5" id="shLoading">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>
          Đang mở playlist…
        </div>

        <div class="text-center py-5 d-none" id="shGone">
          <i class="bi bi-link-45deg display-4 text-body-secondary"></i>
          <p class="mt-2 mb-1 fw-semibold" id="shGoneText">Link chia sẻ không tồn tại hoặc đã hết hạn</p>
          <p class="small text-body-secondary">Hãy hỏi người gửi một link mới.</p>
        </div>

        <section class="d-none" id="shList">
          <div class="d-flex gap-3 align-items-center mb-3">
            <div class="sh-cover" aria-hidden="true"><i class="bi bi-music-note-list"></i></div>
            <div class="min-w-0">
              <div class="small text-body-secondary">Playlist được chia sẻ</div>
              <h1 class="h4 mb-1" id="shName" translate="no"></h1>
              <div class="small text-body-secondary" id="shInfo"></div>
            </div>
          </div>
          <button class="btn btn-primary rounded-pill px-4 mb-3" type="button" id="shPlayAll">
            <i class="bi bi-play-fill"></i> Phát tất cả
          </button>
          <div class="d-flex flex-column" id="shSongs" translate="no"></div>
        </section>
      </main>
    </div>

    <div class="sh-player d-none" id="shPlayer">
      <div class="sh-wrap">
        <div class="d-flex align-items-center gap-2">
          <div class="now" translate="no">
            <span class="fw-semibold" id="shNowTitle"></span>
            <span class="small text-body-secondary" id="shNowArtist"></span>
          </div>
          <button class="btn sh-btn" type="button" id="shPrev" title="Bài trước" aria-label="Bài trước">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <button class="btn sh-btn main" type="button" id="shToggle" title="Phát" aria-label="Phát">
            <i class="bi bi-play-fill" id="shToggleIcon"></i>
          </button>
          <button class="btn sh-btn" type="button" id="shNext" title="Bài tiếp" aria-label="Bài tiếp">
            <i class="bi bi-skip-end-fill"></i>
          </button>
        </div>
        <div class="d-flex align-items-center gap-2 mt-1">
          <span class="sh-time text-end" id="shCur">0:00</span>
          <input
            class="form-range sh-seek flex-grow-1"
            type="range"
            min="0"
            max="1000"
            value="0"
            id="shSeek"
            aria-label="Vị trí trong bài"
          />
          <span class="sh-time" id="shDur">0:00</span>
        </div>
      </div>
    </div>

    <script src="/js/share.js"></script>
  </body>
</html>
